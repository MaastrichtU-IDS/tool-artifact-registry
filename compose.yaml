# The whole minimal install (spec §10.2, requirement 6): one service, one volume.

services:
  registry:
    build: .
    image: ghcr.io/maastrichtu-ids/tool-artifact-registry:0.1.0
    environment:
      TAR_BASE_IRI: ${TAR_BASE_IRI:-http://localhost:8080}
      TAR_ROOT_TOKEN: ${TAR_ROOT_TOKEN:?set me — the registry refuses to start with a default}
      # Uncomment to accept Keycloak / Kubernetes / GitHub Actions tokens from deployments
      # (docs/specs/2026-08-30-workload-identity-addendum.md):
      # TAR_OIDC_ISSUER: https://keycloak.example.org/realms/ids
      # TAR_OIDC_CLIENT_ID: tar-ui
      # TAR_WORKLOAD_ISSUERS: https://token.actions.githubusercontent.com
    ports: ["8080:8080"]
    volumes: ["tar-data:/data"]
    healthcheck:
      test: ["CMD", "/tar", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
    restart: unless-stopped

volumes:
  tar-data:
